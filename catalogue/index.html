<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogue Podium Sports</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071c3c;color:#fff;font:16px system-ui,Arial,sans-serif}.shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 12px 20px}.head{width:min(100%,1150px);display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:800;letter-spacing:.06em;font-size:clamp(16px,2vw,23px)}.sub{font-size:12px;color:#d6e0ef}.book-area{width:100%;flex:1;min-height:390px;display:flex;align-items:center;justify-content:center;overflow:hidden}#book{margin:auto}#book .page{background:#061c3f;overflow:hidden}#book .page img{width:100%;height:100%;display:block;object-fit:contain}.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}.controls button,.controls a{border:1px solid #8097b8;background:#123867;color:#fff;border-radius:8px;padding:11px 17px;font:600 14px system-ui;cursor:pointer;text-decoration:none}.controls button:hover,.controls a:hover{background:#24548d}.counter{min-width:105px;text-align:center;font-size:14px}.help{font-size:12px;color:#c4d0e0;text-align:center;margin:0}.error{max-width:650px;padding:25px;text-align:center;background:#142c50;border-radius:12px;display:none}#book:not(.ready){visibility:hidden}@media(max-width:600px){.shell{padding:10px 5px 14px}.book-area{min-height:320px}.controls{gap:6px}.controls button,.controls a{padding:9px 12px;font-size:13px}}
</style></head><body><main class="shell"><header class="head"><div><div class="brand">PODIUM SPORTS</div><div class="sub">Catalogue • 16 pages</div></div><button id="fullscreen" style="background:transparent;color:white;border:1px solid #8193af;border-radius:8px;padding:9px;cursor:pointer">⛶ Plein écran</button></header><div class="book-area"><div id="book"><div class="page"><img src="pages/page-01.jpg" alt="Catalogue Podium Sports, page 1" loading="eager"></div><div class="page"><img src="pages/page-02.jpg" alt="Catalogue Podium Sports, page 2" loading="eager"></div><div class="page"><img src="pages/page-03.jpg" alt="Catalogue Podium Sports, page 3" loading="lazy"></div><div class="page"><img src="pages/page-04.jpg" alt="Catalogue Podium Sports, page 4" loading="lazy"></div><div class="page"><img src="pages/page-05.jpg" alt="Catalogue Podium Sports, page 5" loading="lazy"></div><div class="page"><img src="pages/page-06.jpg" alt="Catalogue Podium Sports, page 6" loading="lazy"></div><div class="page"><img src="pages/page-07.jpg" alt="Catalogue Podium Sports, page 7" loading="lazy"></div><div class="page"><img src="pages/page-08.jpg" alt="Catalogue Podium Sports, page 8" loading="lazy"></div><div class="page"><img src="pages/page-09.jpg" alt="Catalogue Podium Sports, page 9" loading="lazy"></div><div class="page"><img src="pages/page-10.jpg" alt="Catalogue Podium Sports, page 10" loading="lazy"></div><div class="page"><img src="pages/page-11.jpg" alt="Catalogue Podium Sports, page 11" loading="lazy"></div><div class="page"><img src="pages/page-12.jpg" alt="Catalogue Podium Sports, page 12" loading="lazy"></div><div class="page"><img src="pages/page-13.jpg" alt="Catalogue Podium Sports, page 13" loading="lazy"></div><div class="page"><img src="pages/page-14.jpg" alt="Catalogue Podium Sports, page 14" loading="lazy"></div><div class="page"><img src="pages/page-15.jpg" alt="Catalogue Podium Sports, page 15" loading="lazy"></div><div class="page"><img src="pages/page-16.jpg" alt="Catalogue Podium Sports, page 16" loading="lazy"></div></div><div id="error" class="error">Le moteur du livre n'a pas pu être chargé. Vérifiez votre connexion internet. Vous pouvez toujours <a href="catalogue.pdf" style="color:#fff">ouvrir le catalogue PDF</a>.</div></div><nav class="controls" aria-label="Navigation du catalogue"><button id="prev">← Précédente</button><span class="counter" id="counter">Page 1 / 16</span><button id="next">Suivante →</button><a href="catalogue.pdf" target="_blank" rel="noopener">PDF</a></nav><p class="help">Cliquez sur un coin de page, glissez pour feuilleter ou utilisez les flèches du clavier.</p></main><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script><script>
(function(){const root=document.getElementById('book');const counter=document.getElementById('counter');const pages=Array.from(root.querySelectorAll('.page'));let flip;function setup(){if(!window.St||!St.PageFlip){document.getElementById('error').style.display='block';root.style.display='none';return}flip=new St.PageFlip(root,{width:500,height:710,size:'stretch',minWidth:260,maxWidth:500,minHeight:370,maxHeight:710,maxShadowOpacity:.38,showCover:true,mobileScrollSupport:false,usePortrait:true,flippingTime:750,drawShadow:true,autoSize:true});flip.loadFromHTML(pages);root.classList.add('ready');function refresh(){let n=flip.getCurrentPageIndex()+1;counter.textContent='Page '+Math.min(n,16)+' / 16'}flip.on('flip',refresh);refresh()}document.getElementById('prev').onclick=()=>flip&&flip.flipPrev();document.getElementById('next').onclick=()=>flip&&flip.flipNext();document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')flip?.flipNext();if(e.key==='ArrowLeft')flip?.flipPrev()});setup()})();</script></body></html>
