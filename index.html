<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Podium Sports — Configurateur P1 P2 P6</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;font:16px Arial,sans-serif;color:#102a50}
header{background:#102a50;color:white;text-align:center;padding:20px}
header h1{margin:0 0 6px;font-size:24px}header p{margin:0;font-size:14px}
main{max-width:1200px;margin:15px auto;padding:0 12px}
nav{background:white;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
button{border:0;border-radius:7px;background:#102a50;color:white;padding:12px 16px;cursor:pointer;font-weight:bold}
button:disabled{opacity:.35;cursor:default}
.center{text-align:center}.center strong{display:block;font-size:20px}.center small{color:#52667e}
iframe{width:100%;height:1160px;border:0;border-radius:12px;background:white;margin-top:12px;display:none}
iframe.active{display:block}
@media(max-width:600px){iframe{height:1320px}button{padding:10px 8px;font-size:12px}.center strong{font-size:16px}}
</style></head><body>
<header><h1>PODIUM SPORTS</h1><p>Choisissez votre design et personnalisez ses couleurs</p></header>
<main><nav><button id="prev">❮ Précédent</button><div class="center"><strong id="title">Design P1</strong><small id="counter">1 sur 4</small></div><button id="next">Suivant ❯</button></nav>
<iframe class="active" src="p1.html" title="Configurateur P1"></iframe>
<iframe src="p2.html" title="Configurateur P2" loading="lazy"></iframe>
<iframe src="p3.html" title="Configurateur P3" loading="lazy"></iframe>
<iframe src="p6.html" title="Configurateur P6" loading="lazy"></iframe>
</main><script>
const names=['P1','P2','P3','P6'],frames=[...document.querySelectorAll('iframe')];let current=0;
function show(n){current=Math.max(0,Math.min(3,n));frames.forEach((f,i)=>f.classList.toggle('active',i===current));document.getElementById('title').textContent='Design '+names[current];document.getElementById('counter').textContent='Modèle '+(current+1)+' sur 4';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===3;}
document.getElementById('prev').onclick=()=>show(current-1);
document.getElementById('next').onclick=()=>show(current+1);
show(0);
</script></body></html>
