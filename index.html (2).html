view'),ctx=canvas.getContext('2d',{willReadFrequently:true});let base,masks;\nfunction load(src){return new Promise((res,rej)=>{let i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}\nfunction draw(){if(!base||!masks)return;const src=base.data, dst=ctx.createImageData(750,825),out=dst.data;const m1=masks[0].data,m2=masks[1].data;const targets=values.map(h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)));for(let p=0;p<src.length;p+=4){let rgb=[src[p],src[p+1],src[p+2]];const weights=[m1[p]/255,m1[p+1]/255,m1[p+2]/255,m2[p]/255];for(let j=0;j<4;j++){let a=weights[j];if(a<.005||values[j].toLowerCase()===defaults[j].toLowerCase())continue;const lum=.2126*src[p]+.7152*src[p+1]+.0722*src[p+2];const shade=Math.max(.78,Math.min(1.15,1+(lum-[82,104,47,38][j])*.0025));const c=targets[j];for(let k=0;k<3;k++)rgb[k]=rgb[k]*(1-a)+Math.min(255,c[k]*shade)*a}out[p]=Math.round(rgb[0]);out[p+1]=Math.round(rgb[1]);out[p+2]=Math.round(rgb[2]);out[p+3]=255}ctx.putImageData(dst,0,0)}\nfunction render(){document.getElementById('zones').innerHTML=names.map((n,i)=>`<button class=\"zone ${i===active?'active':''}\" data-zone=\"${i}\"><span class=\"swatch\" style=\"background:${values[i]}\"><\/span><span>${n}<\/span><\/button>`).join('');document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{active=+b.dataset.zone;render()});document.getElementById('palette').innerHTML=groups.map(([name,cs])=>`<div class=\"group\">${name}<\/div><div class=\"palette\">${cs.map(([label,hex])=>`<button class=\"pick ${values[active].toLowerCase()===hex.toLowerCase()?'active':''}\" data-color=\"${hex}\"><span style=\"background:${hex}\"><\/span><small>${label}<\/small><\/button>`).join('')}<\/div>`).join('');document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{values[active]=b.dataset.color;render();draw()})}\ndocument.getElementById('reset').onclick=()=>{values=defaults.slice();active=0;render();draw()};document.getElementById('copy').onclick=()=>{const t=names.map((n,i)=>n+': '+values[i]).join('\\n');if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('Configuration copi\u00e9e')).catch(()=>prompt('Copier',t));else prompt('Copier',t)};\nPromise.all(assets.map(load)).then(images=>{const data=images.map(i=>{const c=document.createElement('canvas');c.width=750;c.height=825;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(i,0,0);return x.getImageData(0,0,750,825)});base=data[0];masks=data.slice(1);render();draw()}).catch(e=>{document.querySelector('.note').textContent='Erreur chargement : '+e.message});render();\n<\/script><\/body><\/html>";
const content6="<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Podium Sports \u2014 P6 PSD Test V13<\/title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#102a50;font:16px Arial,sans-serif}header{background:#102a50;color:white;padding:18px 24px}header strong{font-size:24px}.layout{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding:0 12px}.panel{background:white;border-radius:14px;padding:18px}.panel h2{font-size:21px;margin:0 0 12px}.preview{background:#d5d8db;border-radius:12px;text-align:center}canvas{display:block;width:100%;max-width:600px;margin:auto;height:auto}.zones{display:grid;grid-template-columns:1fr 1fr;gap:9px}.zone{padding:12px;border:2px solid #d1dbe5;border-radius:9px;background:white;color:#102a50;font-weight:bold;cursor:pointer;text-align:left}.zone.active{border-color:#0d65b8;background:#eaf3ff}.dot{display:inline-block;width:18px;height:18px;border:1px solid #9ca3af;vertical-align:middle;margin-right:6px;border-radius:4px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.swatch{height:40px;border:1px solid #999;border-radius:7px;cursor:pointer}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions button{background:#102a50;color:white;border:0;padding:12px;border-radius:7px;cursor:pointer}.note{color:#53657a;font-size:13px;line-height:1.5}@media(max-width:800px){.layout{grid-template-columns:1fr}.palette{grid-template-columns:repeat(5,1fr)}}<\/style><\/head><body><header><strong>PODIUM SPORTS \u2014 Configurateur P6<\/strong><div>Test \u00e0 partir du PSD original \u00b7 5 zones<\/div><\/header><main class=\"layout\"><section class=\"panel\"><h2>Aper\u00e7u du polo P6 \u2014 vue de face<\/h2><div class=\"preview\"><canvas id=\"polo\" width=\"600\" height=\"660\"><\/canvas><\/div><div class=\"actions\"><button id=\"reset\">R\u00e9initiali
