const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{willReadFrequently:true});
function load(src){return new Promise((ok,err)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=err;im.src=src})}
Promise.all([load(baseSrc),...maskSrc.map(load)]).then(imgs=>{
const buffer=document.createElement('canvas');buffer.width=750;buffer.height=825;const bc=buffer.getContext('2d',{willReadFrequently:true});bc.drawImage(imgs[0],0,0);const orig=bc.getImageData(0,0,750,825);
const masks=imgs.slice(1).map(img=>{bc.clearRect(0,0,750,825);bc.drawImage(img,0,0);return bc.getImageData(0,0,750,825).data});
function paint(){const out=new ImageData(new Uint8ClampedArray(orig.data),750,825);for(let k=0;k<3;k++){if(colors[k]===defaults[k])continue;const c=colors[k],r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);for(let i=0;i<out.data.length;i+=4){const m=masks[k][i]/255;if(!m)continue;const old=(orig.data[i]+orig.data[i+1]+orig.data[i+2])/3;let factor=k===0?Math.min(1.32,Math.max(.62,0.92+(old-55)*.0045)):k===1?Math.min(1.45,Math.max(.55,old/125)):Math.min(1.25,Math.max(.65,old/220));const blend=m*(k===0?.985:.985);out.data[i]=out.data[i]*(1-blend)+Math.min(255,r*factor)*blend;out.data[i+1]=out.data[i+1]*(1-blend)+Math.min(255,g*factor)*blend;out.data[i+2]=out.data[i+2]*(1-blend)+Math.min(255,b*factor)*blend;}}ctx.putImageData(out,0,0)}
